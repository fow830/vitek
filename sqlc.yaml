version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema:
      - "db/migrations/000001_init.up.sql"
      - "db/migrations/000002_platform.up.sql"
      - "db/migrations/000003_sessions.up.sql"
      - "db/migrations/000004_listing_search.up.sql"
      - "db/migrations/000005_avito_secrets.up.sql"
      - "db/migrations/000006_listing_filter_seen.up.sql"
      - "db/migrations/000007_listing_filter_watches.up.sql"
      - "db/migrations/000008_watch_lifecycle_health.up.sql"
      - "db/migrations/000009_proxy_bindings.up.sql"
      - "db/migrations/000010_watch_meta.up.sql"
      - "db/migrations/000011_notifications.up.sql"
    gen:
      go:
        package: "repository"
        out: "internal/repository"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
