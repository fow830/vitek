services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vitek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitek}
      POSTGRES_DB: ${POSTGRES_DB:-vitek}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vitek_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vitek_pg:
